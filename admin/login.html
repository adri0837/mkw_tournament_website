<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MK Tournament</title>
    <link rel="icon" type="image/png" href="../assets/icons-random/GrandPrix.png">
    <style>
        @font-face {
            font-family: 'RacersMK';
            src: url('../assets/fonts/RACERSDELIGHT.OTF') format('opentype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'RacersMK', sans-serif;
            background-color: #121212;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #1e1e1e;
            border: 4px solid #e60012;
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(230, 0, 18, 0.3);
            text-align: center;
        }

        .login-card img {
            width: 80px;
            margin-bottom: 10px;
        }

        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            color: #fff;
            font-family: 'RacersMK', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #e60012;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e60012, #8b0000);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'RacersMK', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230, 0, 18, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: rgba(230, 0, 18, 0.15);
            border: 1px solid #e60012;
            color: #ff4444;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            display: none;
            letter-spacing: 1px;
        }

        .checkered {
            height: 10px;
            background-color: #fff;
            background-image:
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%);
            background-size: 14px 14px;
            background-position: 0 0, 7px 7px;
            border-radius: 0 0 14px 14px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="../assets/icons-random/GrandPrix.png" alt="logo">
        <h1>Panel Admin</h1>
        <p class="subtitle">MK Tournament 2026</p>

        <div class="input-group">
            <label>Usuario</label>
            <input type="text" id="username" placeholder="Tu usuario" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">
            Entrar al Panel
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div style="margin-top: 20px;">
            <a href="../index.html"
                style="color:#555; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-decoration:none; transition: color 0.2s;"
                onmouseover="this.style.color='#aaa'" onmouseout="this.style.color='#555'">
                ← Volver al sitio
            </a>
        </div>

        <div class="checkered"></div>
    </div>

    <script>
        // Permitir login con Enter
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') doLogin();
        });

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!username || !password) {
                showError('Completa todos los campos');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = 'index.php';
                } else {
                    showError(data.error || 'Credenciales incorrectas');
                }
            } catch (err) {
                showError('Error de conexión, intenta de nuevo');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar al Panel';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }
    </script>

</body>

</html>
